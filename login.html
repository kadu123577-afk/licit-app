<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licit.ai — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: #00ff88;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: #000; font-size: 14px;
    }
    .logo-text { font-size: 20px; font-weight: 700; }
    .logo-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
    h2 { font-size: 22px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 14px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #00ff88; }
    button {
      width: 100%;
      padding: 12px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .erro {
      background: #2d1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .rodape {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">P</div>
      <div>
        <div class="logo-text">Pesquisa de Preços</div>
        <div class="logo-sub">VIA PNCP</div>
      </div>
    </div>
    <h2>Entrar na plataforma</h2>
    <p>Acesso exclusivo para clientes cadastrados.</p>
    <div class="erro" id="erro"></div>
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com.br" autocomplete="email">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
    <button id="btn-entrar" onclick="entrar()">Entrar</button>
    <div class="rodape">Licit.ai © 2025 · Suporte: carlos@licit.ai</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const _sb = supabase.createClient(
      'https://cputbtpimcwgxpsmfamn.supabase.co',
      'sb_publishable_2u7rKW4GjWSryV9MDdRGAg_xS6nxKtI'
    );

    // Se já tem sessão válida, vai direto pro app
    _sb.auth.getUser().then(({ data, error }) => {
      if (!error && data.user) {
        window.location.replace('/');
      }
    });

    window.entrar = async function() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btn-entrar');
      const erro = document.getElementById('erro');

      if (!email || !senha) {
        erro.textContent = 'Preencha e-mail e senha.';
        erro.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Entrando...';
      erro.style.display = 'none';

      try {
        // Login
        const { data: authData, error: authError } = await _sb.auth.signInWithPassword({ email, password: senha });
        if (authError) throw authError;

        // Busca dados do usuário
        const { data: usuario } = await _sb.from('usuarios')
          .select('*, organizacoes(*)')
          .eq('email', email)
          .single();

        // Verifica acesso
        const acesso = verificarAcesso(usuario);
        if (!acesso.ok) {
          await _sb.auth.signOut();
          erro.textContent = acesso.motivo;
          erro.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return;
        }

        // Salva info do usuário no localStorage
        localStorage.setItem('licit_usuario', JSON.stringify({
          email: usuario.email,
          nome: usuario.nome,
          org: usuario.organizacoes?.nome
        }));

        window.location.replace('/');
      } catch(e) {
        erro.textContent = e.message?.includes('Invalid') ? 'E-mail ou senha incorretos.' : (e.message || 'Erro ao entrar.');
        erro.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    };

    function verificarAcesso(usuario) {
      if (!usuario) return { ok: false, motivo: 'Usuário não encontrado na base.' };
      if (!usuario.ativo) return { ok: false, motivo: 'Usuário inativo.' };
      const org = usuario.organizacoes;
      if (!org) return { ok: false, motivo: 'Organização não encontrada.' };
      if (!org.ativo) return { ok: false, motivo: 'Acesso bloqueado. Entre em contato.' };
      if (org.plano === 'bloqueado') return { ok: false, motivo: 'Acesso suspenso por inadimplência.' };
      if (org.validade && new Date(org.validade) < new Date()) {
        return { ok: false, motivo: 'Período de acesso encerrado.' };
      }
      return { ok: true };
    }

    document.getElementById('senha').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.entrar();
    });
  </script>
</body>
</html>
